services:
  postgres:
    image: postgres:17
    container_name: postgres
    hostname: postgres_container
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: always

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    hostname: pgadmin_container
    env_file:
      - .env
    ports:
      - "8080:80"
    restart: always
